<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="导入两路广告 CSV，与同周旧周报对账，导出周报草稿。">
  <title>广告周报工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="workbench.css">
  <script src="workbench.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell bar-content">
      <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"></span>广告周报工作台</a>
      <span>本机处理</span>
    </div>
  </header>
  <main class="shell">
    <section class="heading" aria-labelledby="title">
      <div>
        <h1 id="title">广告周报对账</h1>
        <p>导入 Google Ads、Meta Ads 和同周旧周报，核对数字后下载这一周的草稿。</p>
      </div>
      <div class="actions">
        <button type="button" id="load-demo" class="secondary">载入模拟数据</button>
        <button type="button" id="load-scope-demo" class="secondary">载入口径对账样例</button>
        <button type="button" id="new-week" class="secondary">开始新一周</button>
      </div>
    </section>
    <section class="scope" aria-labelledby="scope-title">
      <h2 id="scope-title">周报范围</h2>
      <div class="scope-fields">
        <label>周起始日<input type="date" id="week-start" required></label>
        <label>报告币种<input type="text" id="currency" placeholder="USD" maxlength="3" required></label>
        <label>报告时区<input type="text" id="timezone" placeholder="Asia/Shanghai" required></label>
      </div>
      <p>从起始日计算七天。两边用同一周、同一币种和时区，每个平台一个账户。</p>
    </section>
    <section aria-labelledby="inputs-title" class="inputs">
      <div class="section-heading">
        <h2 id="inputs-title">导入文件</h2>
        <p>明细按广告系列和日期导出。旧周报每个平台一行汇总。</p>
      </div>
      <div class="file-grid" id="files"></div>
      <div class="run-bar">
        <p id="run-notice" role="status">导入三份文件后可运行对账。</p>
        <button type="button" class="primary" id="run-report" disabled>运行对账</button>
      </div>
    </section>
    <section class="results" id="results" aria-labelledby="results-title" hidden>
      <div class="section-heading result-heading">
        <div>
          <h2 id="results-title">周报草稿</h2>
          <p id="result-scope"></p>
        </div>
        <button type="button" class="primary" id="download-report" disabled>下载 Markdown 草稿</button>
      </div>
      <p class="result-status" id="result-status" role="status"></p>
      <ul class="findings" id="findings" hidden></ul>
      <div id="result-data" hidden>
        <div class="table-wrap" tabindex="0" role="region" aria-label="平台本周汇总">
          <table>
            <caption>平台本周汇总</caption>
            <thead><tr><th scope="col">平台</th><th scope="col">花费</th><th scope="col">展示</th><th scope="col">点击</th><th scope="col">CTR</th><th scope="col">归因转化</th><th scope="col">CPA</th></tr></thead>
            <tbody id="totals-body"></tbody>
          </table>
        </div>
        <div class="table-wrap compare-table" tabindex="0" role="region" aria-label="与旧周报逐项对账">
          <table>
            <caption>与旧周报逐项对账</caption>
            <thead><tr><th scope="col">平台</th><th scope="col">指标</th><th scope="col">旧周报</th><th scope="col">本次</th><th scope="col">对账结果</th><th scope="col">来源</th></tr></thead>
            <tbody id="compare-body"></tbody>
          </table>
        </div>
        <div id="traces" class="traces" hidden></div>
      </div>
    </section>
  </main>
  <template id="file-card">
    <article class="file-card">
      <h3></h3>
      <p class="format-note"></p>
      <label class="drop-trigger">
        <span>选择文件</span>
        <input type="file">
      </label>
      <p class="file-status" aria-live="polite"></p>
      <details class="mapping" hidden>
        <summary></summary>
        <div class="mapping-body">
          <div class="header-line">
            <label>表头行<input type="number" min="1" step="1"></label>
            <button type="button" class="secondary recognize">重新读取</button>
          </div>
          <div class="mapped-fields"></div>
          <div class="fixed-fields" hidden></div>
          <div class="scope-definitions" hidden></div>
          <label class="confirm-ref" hidden><input type="checkbox"> 确认旧周报使用本次的周范围、币种、时区和这两个账户</label>
        </div>
      </details>
    </article>
  </template>
</body>
</html>
