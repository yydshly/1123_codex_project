name: Deploy research pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'projects/002-ai-overseas-revenue/**'
      - 'projects/004-ai-tool-entry-lab/**'
      - 'projects/005-geo-discovery-guide/**'
      - 'scripts/build_pages.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build static research pages
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
