name: Deploy research pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'projects/002-ai-overseas-revenue/**'
      - 'projects/004-ai-tool-entry-lab/**'
      - 'projects/005-geo-discovery-guide/**'
      - 'projects/006-ai-product-radar/**'
      - 'projects/007-petalwake/**'
      - 'projects/008-tanstarter-research/**'
      - 'projects/009-coastal-street-study/**'
      - 'projects/010-reddit-ops-research/**'
      - 'projects/014-ai-founder-case-studies/**'
      - 'projects/015-ai-topic-source-guide/**'
      - 'scripts/build_pages.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/009-coastal-street-study/demo/package-lock.json
      - name: Build coastal street demo
        working-directory: projects/009-coastal-street-study/demo
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build static research pages
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
